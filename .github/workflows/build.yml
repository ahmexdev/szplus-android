name: Build APK from zip
on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: Exact name of the zip to build
        required: true
        default: SzPlusAndroid-improved-3.zip
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q "${{ github.event.inputs.zip_name }}" -d project
          DIR=$(dirname "$(find project -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleRelease > build.log 2>&1
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SzPlus-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
